services:

  fastapi-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: medibot-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://medibot:medibot@postgresql:5432/medibot_v2
      REDIS_URL: redis://redis:6379/0
    env_file:
      - ../.env
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgresql:
    image: postgres:16-alpine
    container_name: medibot-postgres
    environment:
      POSTGRES_USER: medibot
      POSTGRES_PASSWORD: medibot
      POSTGRES_DB: medibot_v2
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medibot -d medibot_v2"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: medibot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: medibot-celery
    command: >
      celery -A backend.celery_app.celery_app worker
      --loglevel=info
      --concurrency=2
      --queues=celery
    environment:
      DATABASE_URL: postgresql+asyncpg://medibot:medibot@postgresql:5432/medibot_v2
      REDIS_URL: redis://redis:6379/0
    env_file:
      - ../.env
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: medibot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - fastapi-backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: medibot-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
