[alembic]
# Path to migration scripts — relative to CWD when alembic is invoked
# Run alembic from project root: alembic -c alembic/alembic.ini upgrade head
script_location = alembic

# Add project root to sys.path so 'backend' package is importable
prepend_sys_path = .

# Placeholder — overridden in env.py from Settings
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
